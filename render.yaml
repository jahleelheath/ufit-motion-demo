# Demo blueprint for UFIT Motion. Render reads this file at the repo root.
# The production blueprint, which expects a Supabase DATABASE_URL, is render-production.yaml.
#
# This differs from the production blueprint in exactly one way that matters: DATABASE_URL is never set,
# so app/database.py falls back to SQLite on the instance disk. On every cold boot the
# app self-migrates and re-seeds Lincoln Elementary with fabricated students, sessions
# and assessments. No real student record ever reaches this instance, which is the
# whole point: a public demo of a FERPA-scoped product cannot carry FERPA data.
services:
  - type: web
    name: ufit-motion-demo
    runtime: python
    pythonVersion: "3.12.0"
    plan: free
    buildCommand: pip install -r requirements.txt
    # Same gunicorn reasoning as production: 120s timeout so Render's health check does
    # not kill the app while init_db runs on cold boot; one worker with four threads so
    # per-request connections stay safe under concurrency.
    startCommand: gunicorn wsgi:app --workers 1 --threads 4 --timeout 120 --bind "0.0.0.0:$PORT"
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: development
      - key: DB_PATH
        value: /tmp/ufit-demo.db
      - key: UFIT_SECRET_KEY
        generateValue: true
      - key: UFIT_SEED_PASSWORD
        sync: false          # set this in the Render dashboard, never in this file
      - key: UFIT_APP_ROOT
        value: /opt/render/project/src
