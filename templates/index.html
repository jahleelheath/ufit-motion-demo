<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Ufit Motion — School fitness coaching platform for coaches, administrators, and staff." />
  <meta name="theme-color" content="#0A2463" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Ufit Motion" />

  <title>Ufit Motion</title>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet"
  />

  <!-- App Stylesheet -->
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <!-- SPA mount point -->
  <!-- Demo credential panel. Rendered only when DEMO_MODE is on, which is set by
       render.yaml on the public demo instance and is never set in production.
       A founder will not email anyone for a password, so the credentials are on
       the page and one click fills and submits the real login form. This is a
       prefill, not an auth bypass: the request goes through the normal endpoint. -->
  {% if demo_mode %}
  <div id="demo-bar">
    <div class="demo-bar__inner">
      <span class="demo-bar__tag">DEMO</span>
      <span class="demo-bar__text">Sign in as</span>
      <button type="button" class="demo-bar__btn" data-demo-email="admin@ufit.com" data-demo-portal="admin">
        <b>1. Admin</b><i>every school, analytics, audit log</i></button>
      <button type="button" class="demo-bar__btn" data-demo-email="coach@demo.com" data-demo-portal="coach">
        <b>2. Head Coach</b><i>log sessions, assessments, incidents</i></button>
      <button type="button" class="demo-bar__btn" data-demo-email="principal@demo.com" data-demo-portal="org">
        <b>3. Principal</b><i>one school, compliance and growth</i></button>
      <button type="button" class="demo-bar__btn" data-demo-email="parent@demo.com" data-demo-portal="parent">
        <b>4. Parent</b><i>one child, read only</i></button>
      <span class="demo-bar__note">Ordered by how much of the app each role opens. Seeded data only, no real student records.</span>
    </div>
  </div>
  <style>
    #demo-bar{position:sticky;top:0;z-index:9999;background:#0f172a;color:#e2e8f0;
      font:500 13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
      border-bottom:1px solid #1e293b}
    .demo-bar__inner{display:flex;flex-wrap:wrap;gap:8px;align-items:center;
      max-width:1100px;margin:0 auto;padding:8px 16px}
    .demo-bar__tag{background:#f97316;color:#0f172a;font-weight:700;letter-spacing:.06em;
      border-radius:3px;padding:2px 6px;font-size:11px}
    .demo-bar__text{opacity:.8}
    .demo-bar__btn{background:#1e293b;color:#e2e8f0;border:1px solid #334155;border-radius:5px;
      padding:5px 10px;font:inherit;cursor:pointer;text-align:left;line-height:1.25}
    .demo-bar__btn b{display:block;font-weight:600}
    .demo-bar__btn i{display:block;font-style:normal;font-size:11px;opacity:.6}
    .demo-bar__btn:hover{background:#334155}
    .demo-bar__btn:focus-visible{outline:2px solid #f97316;outline-offset:2px}
    .demo-bar__note{opacity:.6;font-size:12px;margin-left:auto}
    @media (max-width:640px){.demo-bar__note{margin-left:0;width:100%}}
  </style>
  <script>
  (function () {
    var PW = {{ demo_password | tojson }};

    function setNative(el, v) {
      var proto = el.tagName === 'TEXTAREA' ? HTMLTextAreaElement : HTMLInputElement;
      Object.getOwnPropertyDescriptor(proto.prototype, 'value').set.call(el, v);
      el.dispatchEvent(new Event('input', { bubbles: true }));
      el.dispatchEvent(new Event('change', { bubbles: true }));
    }

    // The SPA posts { email, password, portal }. Filling only the credentials
    // sends whatever portal happens to be selected, and the API rejects the
    // mismatch with a 400. So the portal card is clicked first, and because the
    // SPA re-renders the form on that click, the fill is deferred a frame.
    function signIn(email, portal) {
      var card = document.querySelector('.portal-card[data-portal="' + portal + '"]');
      if (card && !card.classList.contains('active')) card.click();
      requestAnimationFrame(function () {
        setTimeout(function () {
          var form = document.querySelector('#login-form');
          if (!form) return;
          var e = form.querySelector('#email'), p = form.querySelector('#password');
          if (!e || !p) return;
          setNative(e, email);
          setNative(p, PW);
          form.requestSubmit ? form.requestSubmit() : form.submit();
        }, 60);
      });
    }

    document.addEventListener('click', function (ev) {
      var btn = ev.target.closest('[data-demo-email]');
      if (!btn) return;
      var email = btn.getAttribute('data-demo-email');
      var portal = btn.getAttribute('data-demo-portal');

      // Switching roles from inside the app is the common case: a founder clicks
      // through all four. The session survives a route change, so the SPA just
      // re-renders the dashboard and the click looks like it did nothing. Drop the
      // session first, then land on a real login form.
      if (!document.querySelector('#login-form')) {
        fetch('/api/auth/logout', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin'
        }).catch(function () {}).then(function () {
          try {
            sessionStorage.setItem('demoAutoLogin', JSON.stringify({ email: email, portal: portal }));
          } catch (_) {}
          location.href = '/login';
        });
        return;
      }
      signIn(email, portal);
    });

    // Resume the sign-in the logout above interrupted.
    (function resumeAfterLogout() {
      var raw;
      try { raw = sessionStorage.getItem('demoAutoLogin'); } catch (_) { return; }
      if (!raw) return;
      try { sessionStorage.removeItem('demoAutoLogin'); } catch (_) {}
      var want;
      try { want = JSON.parse(raw); } catch (_) { return; }
      var tries = 0;
      (function attempt() {
        if (document.querySelector('#login-form')) { signIn(want.email, want.portal); return; }
        if (++tries > 40) return;   // ~6s, then give up rather than spin
        setTimeout(attempt, 150);
      })();
    })();

  })();
  </script>
  {% endif %}
  <div id="app"></div>

  <!-- Site footer — visible on every page, not part of the SPA shell -->
  <footer class="site-footer" role="contentinfo">
    <div class="site-footer-inner">
      <span class="site-footer-brand">Ufit Motion</span>
      <nav class="site-footer-nav" aria-label="Legal">
        <a href="/privacy">Privacy</a>
        <a href="/terms">Terms</a>
        <a href="mailto:operations@demo.com">Contact</a>
      </nav>
    </div>
  </footer>

  <!-- App JavaScript (deferred so DOM is ready) -->
  <script src="/static/app.js" defer></script>
</body>
</html>
